<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; img-src data:"><title>Save Password</title><link rel="stylesheet" href="password-save.css"></head>
<body><main id="card" class="card" role="dialog" aria-labelledby="title" aria-describedby="site" hidden>
<section class="ask">
 <header><div class="tile" id="tile" aria-hidden="true"><span id="letter"></span><svg class="key" viewBox="0 0 16 16"><circle cx="5.2" cy="8" r="3.2"/><path d="M8.4 8h6M12.2 8v2.6M14.4 8v1.8"/></svg></div>
  <div class="heading"><h1 id="title">Save password?</h1><p id="site"></p></div>
  <button class="close" id="close" type="button" aria-label="Close"><svg viewBox="0 0 12 12"><path d="M3 3l6 6M9 3l-6 6"/></svg></button></header>
 <div class="fields">
  <label class="row"><span id="user-label">Username</span><input id="username" autocomplete="off" spellcheck="false"></label>
  <label class="row"><span id="pass-label">Password</span><input id="password" type="password" autocomplete="off" spellcheck="false"><button class="eye" id="eye" type="button" aria-label="Show password" aria-pressed="false"><svg viewBox="0 0 20 14"><path class="lid" d="M1.5 7C4 2.6 7 1 10 1s6 1.6 8.5 6C16 11.4 13 13 10 13S4 11.4 1.5 7z"/><circle cx="10" cy="7" r="2.6"/><path class="slash" d="M3 13L17 1"/></svg></button></label>
 </div>
 <footer><button class="link" id="never" type="button">Never for This Site</button><span class="spacer"></span><button class="pill" id="later" type="button">Not Now</button><button class="pill primary" id="save" type="button">Save</button></footer>
 <p class="note"><svg viewBox="0 0 12 14"><rect x="1.5" y="6" width="9" height="7" rx="2"/><path d="M3.8 6V4.2a2.2 2.2 0 014.4 0V6"/></svg><span id="note">Encrypted on this Mac with Keychain</span></p>
</section>
<section class="done" aria-live="polite"><svg viewBox="0 0 52 52" aria-hidden="true"><circle class="ring" cx="26" cy="26" r="22"/><path class="tick" d="M16 27l7 7 13-15"/></svg><p id="done">Password saved</p></section>
</main><script src="password-save.js"></script></body></html>
