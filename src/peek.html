<!doctype html>
<html><head><meta charset="UTF-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https: data:; connect-src 'none'">
<title>Peek</title><link rel="stylesheet" href="surface.css"></head>
<body class="peek">
<header class="peek-bar">
 <button id="peek-back" class="glass-icon" aria-label="Back" title="Back" hidden></button>
 <span class="peek-site"><img id="peek-icon" alt="" hidden><span class="peek-text"><strong id="peek-title"></strong><small id="peek-host"></small></span></span>
 <button id="peek-tab" class="glass-pill" title="Open as tab (⌘↩)"><span id="peek-tab-icon"></span><span>Open as tab</span></button>
 <button id="peek-close" class="glass-icon" aria-label="Close" title="Close (Esc)"></button>
</header>
<script src="locales.js"></script><script src="icons.js"></script><script src="surface-ui.js"></script><script src="peek.js"></script>
</body></html>
