<!doctype html>
<html><head><meta charset="UTF-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'">
<title>Picture in Picture</title><link rel="stylesheet" href="surface.css"></head>
<body class="pip">
<div class="pip-scrim"></div>
<div class="pip-top"><button id="pip-close" class="pip-button small" title="Close" aria-label="Close"></button><button id="pip-return" class="pip-button small" title="Back to tab" aria-label="Back to tab"></button><span class="pip-spacer"></span><button id="pip-mute" class="pip-button small" title="Mute" aria-label="Mute"></button></div>
<div class="pip-center"><button id="pip-back" class="pip-button" title="Back 10 seconds" aria-label="Back 10 seconds"></button><button id="pip-play" class="pip-button large" aria-label="Play"></button><button id="pip-forward" class="pip-button" title="Forward 10 seconds" aria-label="Forward 10 seconds"></button></div>
<div class="pip-bottom"><span id="pip-time">0:00</span><div id="pip-bar" role="slider" aria-label="Position" tabindex="0"><div id="pip-fill"></div></div><span id="pip-left">0:00</span></div>
<script src="locales.js"></script><script src="icons.js"></script><script src="surface-ui.js"></script><script src="pip.js"></script>
</body></html>
