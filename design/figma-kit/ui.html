<!doctype html><meta charset="utf-8"><style>body{font:13px system-ui;padding:16px;color:#242730}button{padding:9px;margin:4px 0}textarea{width:100%;height:190px;font:11px monospace}#status{color:#705065}</style>
<h2>Prism design kit</h2><p>Create editable browser frames, components and color variables. Your layout edits are handed back through the Figma file; colors and geometry export directly to Prism.</p><button id="create">Create starter kit</button> <button id="export">Export theme</button><p id="status"></p><textarea id="json" aria-label="Exported Prism theme JSON" readonly></textarea><a id="download" hidden download="Prism-theme.json">Download theme JSON</a>
<script>let url;for(const type of ['create','export'])document.getElementById(type).onclick=()=>parent.postMessage({pluginMessage:{type}},'*');onmessage=event=>{const m=event.data.pluginMessage;if(!m)return;document.getElementById('status').textContent=m.error||'';if(m.theme){document.getElementById('json').value=m.theme;if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(new Blob([m.theme],{type:'application/json'}));const link=document.getElementById('download');link.href=url;link.hidden=false;}};</script>
